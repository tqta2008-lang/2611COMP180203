<body>
    <h2><u>CÔ HÁI MƠ</u></h2>
    <pre>
<i>Thơ thẩn đường chiều một khách thơ,
Say nhìn xa rặng núi xanh lơ,
Khí trời lặng lẽ và trong trẻo,
Thấp thoáng rừng mơ, <b>Cô hái mơ</b>.
<u>Tác giả</u>: <del>Vô danh</del></i>
    </pre>
