<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Menu ngang một cấp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .menu ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color: #999;
            overflow: hidden;
        }
        .menu li {
            float: left;
            border-right: 1px solid #bbb;
        }
        .menu li a {
            display: block;
            color: black;
            text-align: center;
            padding: 12px 20px;
            text-decoration: none;
            font-weight: bold;
        }
        .menu li a:hover {
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>
    <h1>MINH HỌA MENU NGANG – MỘT CẤP</h1>
    <div class="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Dự án</a></li>
            <li><a href="#">Sản phẩm</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Tin tức</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>
</body>
</html>
