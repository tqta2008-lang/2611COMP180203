<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Rectangles</title>
    <style>
        .outside {
            border: 2px dotted blue;
            border-radius: 15px;
            padding: 20px;
            width: 350px;
            margin: 20px auto;
        }
        .middle {
            border: 2px dashed red;
            border-radius: 15px;
            padding: 20px;
        }
        .inner {
            border: 2px solid green;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="outside">
        <div class="middle">
            <div class="inner">
                I am heavily packed<br>&lt;DIV&gt;
            </div>
        </div>
    </div>
</body>
</html>
