<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 3.1.1 - Tính lãi đơn</title>
</head>
<body>
    <script>
        let tienVay = parseFloat(prompt("Nhập số tiền vay (triệu đồng):"));
        let laiSuat = parseFloat(prompt("Nhập lãi suất (%/năm):"));
        let soNam = parseInt(prompt("Nhập số năm (n):"));

        let tienLaiMotNam = tienVay * (laiSuat / 100);
        let tongTien = tienVay + soNam * tienLaiMotNam;

        alert("Số tiền cả gốc lẫn lãi phải trả sau " + soNam + " năm là: " + tongTien + " (triệu đồng)");
    </script>
</body>
</html>
