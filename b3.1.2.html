<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 3.1.2 - Kiểm tra năm nhuận</title>
</head>
<body>
    <script>
        let year = parseInt(prompt("Nhập vào năm cần kiểm tra:"));
        let isLeapYear = false;

        if ((year % 400 === 0) || (year % 4 === 0 && year % 100 !== 0)) {
            isLeapYear = true;
        }
        if (isLeapYear) {
            alert(year + ": năm nhuận");
        } else {
            alert(year + ": năm không nhuận");
        }
        let month = parseInt(prompt("Nhập vào tháng cần kiểm tra (1-12):"));
        switch (month) {
            case 1: case 3: case 5: case 7: case 8: case 10: case 12:
                alert("Tháng " + month + " năm " + year + " có 31 ngày.");
                break;
            case 4: case 6: case 9: case 11:
                alert("Tháng " + month + " năm " + year + " có 30 ngày.");
                break;
            case 2:
                alert("Tháng 2 năm " + year + " có " + (isLeapYear ? "29" : "28") + " ngày.");
                break;
            default:
                alert("Tháng không hợp lệ!");
        }
    </script>
</body>
</html>
